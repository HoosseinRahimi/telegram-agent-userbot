version: "3.8"

services:
  telegram-userbot:
    build: .
    container_name: telegram_ai_agent_userbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_SESSION_NAME=/data/userbot_session
    volumes:
      # Mount directory for SQLite session, runtime state, and logs (prevents file-as-dir bug)
      - ./data:/data
      - ./persona_prompt.txt:/app/persona_prompt.txt:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
